name: Check

on:
  pull_request:
  push:

concurrency:
  group: takos-office-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Portable product gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - name: Cache OpenTofu 1.12.3
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned: v5.0.5 (2026)
        with:
          path: ${{ runner.tool_cache }}/tofu/1.12.3
          key: ${{ runner.os }}-${{ runner.arch }}-takos-office-tofu-1.12.3-46b48c3438c65cf479fc076c9281422ffa2f493548d1e813d154c835c5986a08-native

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.3
          cache: true
          tofu_wrapper: false
          checksums: 46b48c3438c65cf479fc076c9281422ffa2f493548d1e813d154c835c5986a08

      - name: Verify pinned OpenTofu executable
        run: |
          printf '%s  %s\n' 'd5e3276d613fdc070178ad6b0eb545f79a05e9aeae51f3c20024d21362fe25c6' "$(command -v tofu)" | sha256sum --check --status
          tofu version

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned: v5.0.5 (2026)
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-takos-office-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-takos-office-

      - name: Install Canvas build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: bun install --frozen-lockfile
      - run: bun run check
